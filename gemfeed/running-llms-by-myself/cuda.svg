<svg xmlns="http://www.w3.org/2000/svg" width="900" height="265" viewBox="0 0 900 265" role="img">
<title>CUDA: how vLLM uses the GPU</title>
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.s4{fill:#b77900}.s0{fill:#e4e3df}.line{stroke:#52514e;fill:none}.box{fill:#f0efec;stroke:#c3c2b7}text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#fff}.t2{fill:#c3c2b7}.s1{fill:#286fc3}.s2{fill:#b84418}.s3{fill:#087d54}.s0{fill:#383835}.line{stroke:#c3c2b7}.box{fill:#262625;stroke:#52514e}}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10" fill="#777"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="265" rx="4" class="bg"/>
<text x="24" y="36" font-size="18" text-anchor="start" class="t1">CUDA: how vLLM uses the GPU</text>
<text x="24" y="62" font-size="13" text-anchor="start" class="t2">The CPU organises requests. CUDA lets it launch calculations on the GPU.</text>
<rect x="24" y="96" width="235" height="104" rx="4" class="box"/>
<text x="141" y="124" font-size="16" text-anchor="middle" class="t1">CPU: vLLM</text>
<text x="141" y="150" font-size="12" text-anchor="middle" class="t2">Handles and batches requests</text>
<text x="141" y="174" font-size="12" text-anchor="middle" class="t2">Chooses the next work to run</text>
<path d="M263,148 L314,148" class="line" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="320" y="110" width="190" height="76" rx="4" class="s1"/>
<text x="415" y="141" font-size="16" text-anchor="middle" fill="#fff">CUDA</text>
<text x="415" y="165" font-size="12" text-anchor="middle" fill="#fff">Launches GPU kernels</text>
<path d="M515,148 L566,148" class="line" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="572" y="96" width="304" height="104" rx="4" class="box"/>
<text x="724" y="124" font-size="16" text-anchor="middle" class="t1">GPU: A100</text>
<text x="724" y="150" font-size="12" text-anchor="middle" class="t2">Does the model’s heavy maths</text>
<text x="724" y="174" font-size="12" text-anchor="middle" class="t2">Weights and cache in GPU memory</text>
<text x="24" y="237" font-size="13" text-anchor="start" class="t2">A kernel is a GPU program. vLLM and its libraries supply these; I do not write CUDA code.</text>
</svg>
