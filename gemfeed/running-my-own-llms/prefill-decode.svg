<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 215" width="860" height="215" role="img">
<title>One request: prefill, then decode</title>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .mu{fill:#898781} .ln{stroke:#d9d8d4}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .s4{fill:#eda100} .s5{fill:#e87ba4} .s0{fill:#e4e3df}
  .ar{stroke:#52514e;fill:none} .ah{fill:#52514e} .box{fill:#f0efec;stroke:#c3c2b7} .wg{stroke:#1baf7a;fill:none}
  .st1{stroke:#2a78d6} .st2{stroke:#eb6834} .st3{stroke:#1baf7a} .st4{stroke:#eda100} .st5{stroke:#e87ba4}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .ln{stroke:#383835}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .s4{fill:#c98500} .s5{fill:#d55181} .s0{fill:#383835}
    .ar{stroke:#c3c2b7} .ah{fill:#c3c2b7} .box{fill:#262625;stroke:#52514e} .wg{stroke:#199e70}
    .st1{stroke:#3987e5} .st2{stroke:#d95926} .st3{stroke:#199e70} .st4{stroke:#c98500} .st5{stroke:#d55181}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="860" height="215" rx="8"/>
<text class="t1" x="24" y="36" font-size="18" text-anchor="start" font-weight="600">One request: prefill, then decode</text>
<text class="t2" x="24" y="58" font-size="12" text-anchor="start" font-weight="400">Illustrative timing for a long agent prompt; the exact split depends on prompt and answer length.</text>
<rect class="s1" x="40" y="100" width="150" height="44" rx="4"/>
<text x="115" y="127" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">prefill</text>
<rect class="s2" x="194" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="218" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="242" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="266" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="290" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="314" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="338" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="362" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="386" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="410" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="434" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="458" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="482" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="506" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="530" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="554" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="578" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="602" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="626" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="650" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="674" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="698" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="722" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="746" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="770" y="100" width="20" height="44" rx="3"/>
<rect class="s2" x="794" y="100" width="20" height="44" rx="3"/>
<text class="t2" x="40" y="90" font-size="12" text-anchor="start" font-weight="400">you hit enter</text>
<text class="t2" x="194" y="90" font-size="12" text-anchor="start" font-weight="400">first token appears</text>
<line class="ar" x1="192" y1="94" x2="192" y2="150" stroke-width="1.5" stroke-dasharray="3 3"/>
<text class="t1" x="40" y="172" font-size="13" text-anchor="start" font-weight="600">whole prompt at once, in parallel</text>
<text class="t2" x="40" y="192" font-size="12" text-anchor="start" font-weight="400">compute-bound: 1000s of tok/s</text>
<text class="t1" x="340" y="172" font-size="13" text-anchor="start" font-weight="600">one token per step, each step re-reads all weights from VRAM</text>
<text class="t2" x="340" y="192" font-size="12" text-anchor="start" font-weight="400">memory-bandwidth-bound: 10s of tok/s. This is the speed you "feel".</text>
</svg>
