<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img">
<title>Speculative decoding: draft cheaply, verify together</title>
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.s4{fill:#b77900}.s0{fill:#e4e3df}.line{stroke:#52514e;fill:none}.box{fill:#f0efec;stroke:#c3c2b7}text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#fff}.t2{fill:#c3c2b7}.s1{fill:#286fc3}.s2{fill:#b84418}.s3{fill:#087d54}.s0{fill:#383835}.line{stroke:#c3c2b7}.box{fill:#262625;stroke:#52514e}}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10" fill="#777"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="370" rx="4" class="bg"/>
<text x="24" y="36" font-size="18" text-anchor="start" class="t1">Speculative decoding: draft cheaply, verify together</text>
<text x="24" y="62" font-size="13" text-anchor="start" class="t2">Simplified greedy-decoding example. Boxes are stages, not a time scale.</text>
<text x="24" y="103" font-size="15" text-anchor="start" class="t1">Ordinary decode</text>
<text x="24" y="125" font-size="13" text-anchor="start" class="t2">4 target-model passes</text>
<rect x="250" y="89" width="135" height="48" rx="4" class="s1"/>
<text x="317" y="111" font-size="12" text-anchor="middle" fill="#fff">Pass 1</text>
<text x="317" y="128" font-size="12" text-anchor="middle" fill="#fff">func</text>
<rect x="400" y="89" width="135" height="48" rx="4" class="s1"/>
<text x="467" y="111" font-size="12" text-anchor="middle" fill="#fff">Pass 2</text>
<text x="467" y="128" font-size="12" text-anchor="middle" fill="#fff">main</text>
<rect x="550" y="89" width="135" height="48" rx="4" class="s1"/>
<text x="617" y="111" font-size="12" text-anchor="middle" fill="#fff">Pass 3</text>
<text x="617" y="128" font-size="12" text-anchor="middle" fill="#fff">(</text>
<rect x="700" y="89" width="135" height="48" rx="4" class="s1"/>
<text x="767" y="111" font-size="12" text-anchor="middle" fill="#fff">Pass 4</text>
<text x="767" y="128" font-size="12" text-anchor="middle" fill="#fff">)</text>
<text x="24" y="190" font-size="15" text-anchor="start" class="t1">Speculative decode</text>
<text x="24" y="212" font-size="13" text-anchor="start" class="t2">Draft + verification</text>
<rect x="250" y="162" width="210" height="67" rx="4" class="s4"/>
<text x="355" y="185" font-size="13" text-anchor="middle" fill="#fff">Cheap drafting work</text>
<text x="355" y="211" font-size="14" text-anchor="middle" fill="#fff">func   main   (   {</text>
<path d="M465,195 L507,195" class="line" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="512" y="162" width="310" height="67" rx="4" class="s1"/>
<text x="667" y="187" font-size="13" text-anchor="middle" fill="#fff">One target-model verification pass</text>
<text x="667" y="211" font-size="12" text-anchor="middle" fill="#fff">Accept 3 guesses; replace the mismatch</text>
<text x="24" y="276" font-size="15" text-anchor="start" class="t1">Result: 4 tokens</text>
<rect x="250" y="250" width="135" height="42" rx="4" class="s3"/>
<text x="317" y="277" font-size="15" text-anchor="middle" fill="#fff">func</text>
<rect x="400" y="250" width="135" height="42" rx="4" class="s3"/>
<text x="467" y="277" font-size="15" text-anchor="middle" fill="#fff">main</text>
<rect x="550" y="250" width="135" height="42" rx="4" class="s3"/>
<text x="617" y="277" font-size="15" text-anchor="middle" fill="#fff">(</text>
<rect x="700" y="250" width="135" height="42" rx="4" class="s2"/>
<text x="767" y="277" font-size="15" text-anchor="middle" fill="#fff">)</text>
<text x="250" y="314" font-size="12" text-anchor="start" class="t2">Green: accepted guesses. Orange: replacement for the rejected “{”.</text>
<text x="24" y="347" font-size="12" text-anchor="start" class="t2">With sampling, acceptance preserves the target distribution, not identical text across runs.</text>
</svg>
