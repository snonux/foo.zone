<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img">
<title>One agent turn: the tool-calling loop</title>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .mu{fill:#898781} .ln{stroke:#d9d8d4}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .s0{fill:#e4e3df} .ar{stroke:#52514e;fill:none}
  .ah{fill:#52514e} .box{fill:#f0efec;stroke:#c3c2b7}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .ln{stroke:#383835}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .s0{fill:#383835} .ar{stroke:#c3c2b7} .ah{fill:#c3c2b7}
    .box{fill:#262625;stroke:#52514e}
  }
</style>
<rect class="bg" width="860" height="470" rx="8"/>
<text class="t1" x="24" y="36" font-size="18" font-weight="600">One agent turn: the tool-calling loop</text>
<rect class="box" x="90" y="60" width="220" height="56" rx="8"/>
<text class="t1" x="200" y="84" font-size="15" font-weight="600" text-anchor="middle">pi (harness)</text>
<text class="t2" x="200" y="104" font-size="12" text-anchor="middle">laptop, runs the tools</text>
<rect class="box" x="550" y="60" width="220" height="56" rx="8"/>
<text class="t1" x="660" y="84" font-size="15" font-weight="600" text-anchor="middle">vLLM + model</text>
<text class="t2" x="660" y="104" font-size="12" text-anchor="middle">VM, only produces text</text>
<line class="ar" x1="200" x2="200" y1="116" y2="440" stroke-dasharray="4 4"/>
<line class="ar" x1="660" x2="660" y1="116" y2="440" stroke-dasharray="4 4"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<line class="ar" x1="200" x2="660" y1="165" y2="165" stroke-width="2" marker-end="url(#a)"/>
<circle class="s1" cx="222" cy="165" r="11"/>
<text x="222" y="169" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text class="t1" x="430.0" y="153" font-size="13" text-anchor="middle">system prompt + tool schemas + user prompt</text>
<text class="t2" x="430.0" y="185" font-size="12" text-anchor="middle">POST /v1/chat/completions</text>
<line class="ar" x1="660" x2="200" y1="240" y2="240" stroke-width="2" marker-end="url(#a)"/>
<circle class="s2" cx="638" cy="240" r="11"/>
<text x="638" y="244" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text class="t1" x="430.0" y="228" font-size="13" text-anchor="middle">tool_calls: read_file {"path": "main.go"}</text>
<text class="t2" x="430.0" y="260" font-size="12" text-anchor="middle">no answer yet, just a structured request</text>
<rect class="box" x="40" y="275" width="320" height="44" rx="8"/>
<circle class="s3" cx="64" cy="297" r="11"/><text x="64" y="301" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text class="t1" x="208" y="302" font-size="13" text-anchor="middle">harness runs read_file locally</text>
<line class="ar" x1="200" x2="660" y1="365" y2="365" stroke-width="2" marker-end="url(#a)"/>
<circle class="s1" cx="222" cy="365" r="11"/>
<text x="222" y="369" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text class="t1" x="430.0" y="353" font-size="13" text-anchor="middle">whole history again + tool result</text>
<text class="t2" x="430.0" y="385" font-size="12" text-anchor="middle">prefix cache: only the new part is prefilled</text>
<line class="ar" x1="660" x2="200" y1="425" y2="425" stroke-width="2" marker-end="url(#a)"/>
<circle class="s2" cx="638" cy="425" r="11"/>
<text x="638" y="429" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text class="t1" x="430.0" y="413" font-size="13" text-anchor="middle">final answer as text (or another tool call → back to 3)</text>
<text class="t2" x="430.0" y="445" font-size="12" text-anchor="middle"></text>
</svg>
