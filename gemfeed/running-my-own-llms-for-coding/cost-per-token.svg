<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img">
<title>A100 rental: output-equivalent cost per million tokens</title>
<style>
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.s4{fill:#b77900}.s0{fill:#e4e3df}.line{stroke:#52514e;fill:none}.box{fill:#f0efec;stroke:#c3c2b7}text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#fff}.t2{fill:#c3c2b7}.s1{fill:#286fc3}.s2{fill:#b84418}.s3{fill:#087d54}.s0{fill:#383835}.line{stroke:#c3c2b7}.box{fill:#262625;stroke:#52514e}}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10" fill="#777"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="360" rx="4" class="bg"/>
<text x="24" y="36" font-size="18" text-anchor="start" class="t1">A100 rental: output-equivalent cost per million tokens</text>
<text x="24" y="62" font-size="13" text-anchor="start" class="t2">At $1.35/hour. Each bar allocates the entire rental cost to generated tokens.</text>
<text x="24" y="95" font-size="13" text-anchor="start" class="t1">Sustained-output estimates (exclude extra idle and prefill time)</text>
<text x="24" y="132" font-size="13" text-anchor="start" class="t2">40 tok/s, one stream</text>
<rect x="270" y="111" width="468.75" height="28" rx="4" class="s1"/>
<text x="750" y="131" font-size="13" text-anchor="start" class="t2">$9.38</text>
<text x="24" y="177" font-size="13" text-anchor="start" class="t2">100 tok/s, aggregate</text>
<rect x="270" y="156" width="187.5" height="28" rx="4" class="s1"/>
<text x="470" y="176" font-size="13" text-anchor="start" class="t2">$3.75</text>
<text x="24" y="225" font-size="13" text-anchor="start" class="t1">Recorded session (includes prompts, tool waits and idle gaps)</text>
<text x="24" y="263" font-size="13" text-anchor="start" class="t2">$1.78 / 250K output tokens</text>
<rect x="270" y="242" width="356" height="28" rx="4" class="s2"/>
<text x="638" y="262" font-size="13" text-anchor="start" class="t2">$7.12</text>
<text x="24" y="310" font-size="13" text-anchor="start" class="t2">These are alternative accounting views, not separate input and output charges.</text>
<text x="24" y="333" font-size="13" text-anchor="start" class="t2">An API comparison needs verified input/cache counts and a dated provider quote.</text>
</svg>
