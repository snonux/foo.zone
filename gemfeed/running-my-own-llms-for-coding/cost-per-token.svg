<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img">
<title>Cost per million tokens: rented A100 vs OpenRouter</title>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .mu{fill:#898781} .ln{stroke:#d9d8d4}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .s0{fill:#e4e3df} .ar{stroke:#52514e;fill:none}
  .ah{fill:#52514e} .box{fill:#f0efec;stroke:#c3c2b7}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .ln{stroke:#383835}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .s0{fill:#383835} .ar{stroke:#c3c2b7} .ah{fill:#c3c2b7}
    .box{fill:#262625;stroke:#52514e}
  }
</style>
<rect class="bg" width="860" height="440" rx="8"/>
<text class="t1" x="24" y="36" font-size="18" font-weight="600">Cost per million tokens: rented A100 vs OpenRouter</text>
<text class="t2" x="24" y="60" font-size="13">Qwen3.8 27B FP8, one ~80 minute morning, ~90–95% prefix cache hits. Each panel has its own scale.</text>
<text class="t1" x="24" y="104" font-size="14" font-weight="600">New prompt tokens</text>
<line class="ln" x1="144" x2="144" y1="116" y2="188" stroke-width="1"/>
<text class="t2" x="136" y="137" font-size="12" text-anchor="end">VM</text>
<rect class="s1" x="144" y="124" width="114.0" height="20" rx="4"/>
<text class="t1" x="266.0" y="139" font-size="12" font-weight="600">$0.05–0.15</text>
<text class="t2" x="136" y="171" font-size="12" text-anchor="end">OpenRouter</text>
<rect class="s2" x="144" y="158" width="159.6" height="20" rx="4"/>
<text class="t1" x="311.6" y="173" font-size="12" font-weight="600">$0.21</text>
<text class="t1" x="452" y="104" font-size="14" font-weight="600">Cached prompt tokens</text>
<line class="ln" x1="572" x2="572" y1="116" y2="188" stroke-width="1"/>
<text class="t2" x="564" y="137" font-size="12" text-anchor="end">VM</text>
<rect class="s1" x="572" y="124" width="2.0" height="20" rx="4"/>
<text class="t1" x="582.0" y="139" font-size="12" font-weight="600">≈ $0</text>
<text class="t2" x="564" y="171" font-size="12" text-anchor="end">OpenRouter</text>
<rect class="s2" x="572" y="158" width="114.0" height="20" rx="4"/>
<text class="t1" x="694.0" y="173" font-size="12" font-weight="600">$0.15</text>
<text class="t1" x="24" y="274" font-size="14" font-weight="600">Generated tokens</text>
<line class="ln" x1="144" x2="144" y1="286" y2="392" stroke-width="1"/>
<text class="t2" x="136" y="307" font-size="12" text-anchor="end">VM, 1 agent</text>
<rect class="s1" x="144" y="294" width="171.0" height="20" rx="4"/>
<text class="t1" x="323.0" y="309" font-size="12" font-weight="600">~$9</text>
<text class="t2" x="136" y="341" font-size="12" text-anchor="end">VM, 2–3 agents</text>
<rect class="s1" x="144" y="328" width="76.0" height="20" rx="4"/>
<text class="t1" x="228.0" y="343" font-size="12" font-weight="600">$3–5</text>
<text class="t2" x="136" y="375" font-size="12" text-anchor="end">OpenRouter</text>
<rect class="s2" x="144" y="362" width="48.5" height="20" rx="4"/>
<text class="t1" x="200.5" y="377" font-size="12" font-weight="600">$2.55</text>
<text class="t1" x="452" y="274" font-size="14" font-weight="600">That morning, all tokens</text>
<line class="ln" x1="572" x2="572" y1="286" y2="358" stroke-width="1"/>
<text class="t2" x="564" y="307" font-size="12" text-anchor="end">VM</text>
<rect class="s1" x="572" y="294" width="121.6" height="20" rx="4"/>
<text class="t1" x="701.6" y="309" font-size="12" font-weight="600">$0.16</text>
<text class="t2" x="564" y="341" font-size="12" text-anchor="end">OpenRouter</text>
<rect class="s2" x="572" y="328" width="152.0" height="20" rx="4"/>
<text class="t1" x="732.0" y="343" font-size="12" font-weight="600">$0.20</text>
</svg>
