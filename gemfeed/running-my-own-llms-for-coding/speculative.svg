<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img">
<title>Speculative decoding</title>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .mu{fill:#898781} .ln{stroke:#d9d8d4}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .s4{fill:#eda100} .s0{fill:#e4e3df} .ar{stroke:#52514e;fill:none}
  .ah{fill:#52514e} .box{fill:#f0efec;stroke:#c3c2b7}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .ln{stroke:#383835}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .s4{fill:#c98500} .s0{fill:#383835} .ar{stroke:#c3c2b7} .ah{fill:#c3c2b7}
    .box{fill:#262625;stroke:#52514e}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="860" height="310" rx="8"/>
<text class="t1" x="24" y="36" font-size="18" text-anchor="start" font-weight="600">Speculative decoding: guess cheaply, verify in one pass</text>
<text class="t2" x="24" y="58" font-size="12" text-anchor="start" font-weight="400">Each big box is one full pass of the big model (all 28.9 GiB of weights read from VRAM once).</text>
<text class="t1" x="24" y="96" font-size="14" text-anchor="start" font-weight="600">Normal decode</text>
<text class="t2" x="24" y="114" font-size="12" text-anchor="start" font-weight="400">4 passes → 4 tokens</text>
<rect class="s1" x="200" y="80" width="130" height="44" rx="4"/>
<text x="265" y="100" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">pass 1</text>
<text x="265" y="116" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">→ "func"</text>
<rect class="s1" x="340" y="80" width="130" height="44" rx="4"/>
<text x="405" y="100" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">pass 2</text>
<text x="405" y="116" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">→ "main"</text>
<rect class="s1" x="480" y="80" width="130" height="44" rx="4"/>
<text x="545" y="100" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">pass 3</text>
<text x="545" y="116" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">→ "("</text>
<rect class="s1" x="620" y="80" width="130" height="44" rx="4"/>
<text x="685" y="100" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">pass 4</text>
<text x="685" y="116" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">→ ")"</text>
<text class="t1" x="24" y="186" font-size="14" text-anchor="start" font-weight="600">Speculative</text>
<text class="t2" x="24" y="204" font-size="12" text-anchor="start" font-weight="400">1 small guess + 1 pass</text>
<text class="t2" x="24" y="220" font-size="12" text-anchor="start" font-weight="400">→ 4 tokens</text>
<rect class="s4" x="200" y="170" width="130" height="44" rx="4"/>
<text x="265" y="190" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">MTP head guesses</text>
<text x="265" y="206" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">4 tokens (cheap)</text>
<line class="ar" x1="334" y1="192" x2="354" y2="192" stroke-width="2" marker-end="url(#a)"/>
<rect class="s1" x="360" y="170" width="130" height="44" rx="4"/>
<text x="425" y="190" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">1 pass</text>
<text x="425" y="206" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">checks all 4</text>
<line class="ar" x1="494" y1="192" x2="514" y2="192" stroke-width="2" marker-end="url(#a)"/>
<rect class="s3" x="520" y="170" width="52" height="44" rx="4"/>
<text x="546" y="190" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">func</text>
<text x="546" y="206" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">✓</text>
<rect class="s3" x="578" y="170" width="52" height="44" rx="4"/>
<text x="604" y="190" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">main</text>
<text x="604" y="206" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">✓</text>
<rect class="s3" x="636" y="170" width="52" height="44" rx="4"/>
<text x="662" y="190" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">(</text>
<text x="662" y="206" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">✓</text>
<rect class="s2" x="694" y="170" width="52" height="44" rx="4"/>
<text x="720" y="190" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">{</text>
<text x="720" y="206" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">✗</text>
<text class="t2" x="520" y="236" font-size="12" text-anchor="start" font-weight="400">3 guesses accepted; at the first wrong one, the</text>
<text class="t2" x="520" y="252" font-size="12" text-anchor="start" font-weight="400">big model's own token ")" is used instead.</text>
<rect class="s1" x="24" y="277" width="12" height="12" rx="2"/>
<text class="t2" x="42" y="288" font-size="12" text-anchor="start" font-weight="400">big model pass</text>
<rect class="s4" x="170" y="277" width="12" height="12" rx="2"/>
<text class="t2" x="188" y="288" font-size="12" text-anchor="start" font-weight="400">cheap guess</text>
<rect class="s3" x="290" y="277" width="12" height="12" rx="2"/>
<text class="t2" x="308" y="288" font-size="12" text-anchor="start" font-weight="400">accepted guess</text>
<rect class="s2" x="430" y="277" width="12" height="12" rx="2"/>
<text class="t2" x="448" y="288" font-size="12" text-anchor="start" font-weight="400">rejected guess</text>
</svg>
