<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 524" width="860" height="524" role="img">
<title>How vLLM uses the GPU through CUDA</title>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .mu{fill:#898781} .ln{stroke:#d9d8d4}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .s4{fill:#eda100} .s0{fill:#e4e3df} .ar{stroke:#52514e;fill:none}
  .ah{fill:#52514e} .box{fill:#f0efec;stroke:#c3c2b7}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .ln{stroke:#383835}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .s4{fill:#c98500} .s0{fill:#383835} .ar{stroke:#c3c2b7} .ah{fill:#c3c2b7}
    .box{fill:#262625;stroke:#52514e}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="860" height="524" rx="8"/>
<text class="t1" x="24" y="36" font-size="18" text-anchor="start" font-weight="600">How vLLM uses the GPU through CUDA (A100 80 GB)</text>
<text class="t2" x="24" y="58" font-size="12" text-anchor="start" font-weight="400">CPU side: decides what to run. GPU side: does the math. One decode step, simplified.</text>
<rect class="box" x="24" y="78" width="300" height="330" rx="8"/>
<text class="t1" x="174" y="100" font-size="14" text-anchor="middle" font-weight="600">CPU (host)</text>
<rect class="s1" x="44" y="116" width="260" height="40" rx="4"/>
<text x="174" y="141" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">vLLM: scheduler, batching, tokenizer</text>
<rect class="s1" x="44" y="166" width="260" height="40" rx="4"/>
<text x="174" y="191" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">PyTorch: the model as Python code</text>
<rect class="s3" x="44" y="216" width="260" height="48" rx="4"/>
<text x="174" y="236" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">kernels: FlashAttention 2, Marlin FP8,</text>
<text x="174" y="254" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">FlashInfer sampling, Triton</text>
<rect class="s0" x="44" y="274" width="260" height="40" rx="4"/>
<text class="t1" x="174" y="299" font-size="12" text-anchor="middle" font-weight="600">CUDA runtime + driver 570</text>
<rect class="s4" x="44" y="324" width="260" height="40" rx="4"/>
<text x="174" y="349" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">CUDA graph: replay all launches at once</text>
<text class="t2" x="174" y="388" font-size="11" text-anchor="middle" font-weight="400">kernels are compiled once, then launched</text>
<text class="t2" x="174" y="404" font-size="11" text-anchor="middle" font-weight="400">on the GPU for every decode step</text>
<line class="ar" x1="330" y1="240" x2="392" y2="240" stroke-width="2.5" marker-end="url(#a)"/>
<text class="t2" x="361" y="228" font-size="11" text-anchor="middle" font-weight="400">launch</text>
<text class="mu" x="361" y="260" font-size="11" text-anchor="middle" font-weight="400">PCIe</text>
<rect class="box" x="398" y="78" width="438" height="330" rx="8"/>
<text class="t1" x="617" y="100" font-size="14" text-anchor="middle" font-weight="600">GPU (device): NVIDIA A100</text>
<rect class="s2" x="418" y="116" width="398" height="50" rx="4"/>
<text x="617" y="137" font-size="12" text-anchor="middle" font-weight="600" fill="#ffffff">HBM2e memory: 80 GB, ~1.9 TB/s</text>
<text x="617" y="155" font-size="11" text-anchor="middle" fill="#ffffff">weights (28.9 GiB) + KV cache (40.9 GiB)</text>
<line class="ar" x1="617" y1="168" x2="617" y2="186" stroke-width="2" marker-end="url(#a)"/>
<rect class="s0" x="418" y="190" width="398" height="30" rx="4"/>
<text class="t1" x="617" y="210" font-size="12" text-anchor="middle" font-weight="600">L2 cache: 40 MB</text>
<line class="ar" x1="617" y1="222" x2="617" y2="240" stroke-width="2" marker-end="url(#a)"/>
<rect class="s3" x="418.0" y="244" width="40" height="30" rx="3"/>
<text x="438.0" y="263" font-size="11" text-anchor="middle" font-weight="600" fill="#ffffff">SM</text>
<rect class="s3" x="462.5" y="244" width="40" height="30" rx="3"/>
<rect class="s3" x="507.0" y="244" width="40" height="30" rx="3"/>
<rect class="s3" x="551.5" y="244" width="40" height="30" rx="3"/>
<rect class="s3" x="596.0" y="244" width="40" height="30" rx="3"/>
<rect class="s3" x="640.5" y="244" width="40" height="30" rx="3"/>
<rect class="s3" x="685.0" y="244" width="40" height="30" rx="3"/>
<rect class="s3" x="729.5" y="244" width="40" height="30" rx="3"/>
<rect class="s3" x="774.0" y="244" width="40" height="30" rx="3"/>
<rect class="s3" x="418.0" y="278" width="40" height="30" rx="3"/>
<rect class="s3" x="462.5" y="278" width="40" height="30" rx="3"/>
<rect class="s3" x="507.0" y="278" width="40" height="30" rx="3"/>
<rect class="s3" x="551.5" y="278" width="40" height="30" rx="3"/>
<rect class="s3" x="596.0" y="278" width="40" height="30" rx="3"/>
<rect class="s3" x="640.5" y="278" width="40" height="30" rx="3"/>
<rect class="s3" x="685.0" y="278" width="40" height="30" rx="3"/>
<rect class="s3" x="729.5" y="278" width="40" height="30" rx="3"/>
<rect class="s3" x="774.0" y="278" width="40" height="30" rx="3"/>
<rect class="s3" x="418.0" y="312" width="40" height="30" rx="3"/>
<rect class="s3" x="462.5" y="312" width="40" height="30" rx="3"/>
<rect class="s3" x="507.0" y="312" width="40" height="30" rx="3"/>
<rect class="s3" x="551.5" y="312" width="40" height="30" rx="3"/>
<rect class="s3" x="596.0" y="312" width="40" height="30" rx="3"/>
<rect class="s3" x="640.5" y="312" width="40" height="30" rx="3"/>
<rect class="s3" x="685.0" y="312" width="40" height="30" rx="3"/>
<rect class="s3" x="729.5" y="312" width="40" height="30" rx="3"/>
<rect class="s3" x="774.0" y="312" width="40" height="30" rx="3"/>
<text class="t2" x="617" y="360" font-size="12" text-anchor="middle" font-weight="400">108 streaming multiprocessors (SMs), each with CUDA cores,</text>
<text class="t2" x="617" y="378" font-size="12" text-anchor="middle" font-weight="400">tensor cores for matrix math, and fast on-chip memory.</text>
<text class="t2" x="617" y="396" font-size="12" text-anchor="middle" font-weight="400">A kernel runs as thousands of threads spread over all SMs.</text>
<text class="t1" x="24" y="440" font-size="14" text-anchor="start" font-weight="600">Why decode is memory-bound:</text>
<text class="t2" x="24" y="462" font-size="12" text-anchor="start" font-weight="400">every decode step streams all 28.9 GiB of weights from HBM through the SMs once.</text>
<text class="t2" x="24" y="482" font-size="12" text-anchor="start" font-weight="400">28.9 GiB ÷ ~1.9 TB/s ≈ 16 ms per step → at most ~60 tokens/s for one conversation. I measure ~40.</text>
<text class="t2" x="24" y="502" font-size="12" text-anchor="start" font-weight="400">With 3 conversations in a batch, the same weight read produces 3 tokens, so the total goes up.</text>
</svg>
