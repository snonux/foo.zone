<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 305" width="860" height="305" role="img">
<title>Dense vs mixture-of-experts (MoE)</title>
<style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .mu{fill:#898781} .ln{stroke:#d9d8d4}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s3{fill:#1baf7a} .s4{fill:#eda100} .s5{fill:#e87ba4} .s0{fill:#e4e3df}
  .ar{stroke:#52514e;fill:none} .ah{fill:#52514e} .box{fill:#f0efec;stroke:#c3c2b7} .wg{stroke:#1baf7a;fill:none}
  .st1{stroke:#2a78d6} .st2{stroke:#eb6834} .st3{stroke:#1baf7a} .st4{stroke:#eda100} .st5{stroke:#e87ba4}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t1{fill:#ffffff} .t2{fill:#c3c2b7} .ln{stroke:#383835}
    .s1{fill:#3987e5} .s2{fill:#d95926} .s3{fill:#199e70} .s4{fill:#c98500} .s5{fill:#d55181} .s0{fill:#383835}
    .ar{stroke:#c3c2b7} .ah{fill:#c3c2b7} .box{fill:#262625;stroke:#52514e} .wg{stroke:#199e70}
    .st1{stroke:#3987e5} .st2{stroke:#d95926} .st3{stroke:#199e70} .st4{stroke:#c98500} .st5{stroke:#d55181}
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="860" height="305" rx="8"/>
<text class="t1" x="24" y="36" font-size="18" text-anchor="start" font-weight="600">Dense vs mixture-of-experts (MoE)</text>
<text class="t1" x="40" y="72" font-size="14" text-anchor="start" font-weight="600">Dense 27B: every token uses all weights</text>
<text class="t2" x="40" y="112" font-size="13" text-anchor="start" font-weight="400">token</text>
<line class="ar" x1="82" y1="108" x2="118" y2="108" stroke-width="2" marker-end="url(#a)"/>
<rect class="s1" x="122" y="86" width="250" height="44" rx="4"/>
<text x="247" y="113" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">all 27B parameters</text>
<text class="t2" x="40" y="156" font-size="13" text-anchor="start" font-weight="400">read per token: 27B</text>
<text class="t2" x="40" y="176" font-size="13" text-anchor="start" font-weight="400">in VRAM: 27B</text>
<text class="t1" x="470" y="72" font-size="14" text-anchor="start" font-weight="600">MoE 35B-A3B: a router picks a few experts</text>
<text class="t2" x="470" y="120" font-size="13" text-anchor="start" font-weight="400">token</text>
<line class="ar" x1="512" y1="116" x2="540" y2="116" stroke-width="2" marker-end="url(#a)"/>
<rect class="box" x="544" y="98" width="70" height="36" rx="8"/>
<text class="t1" x="579" y="121" font-size="13" text-anchor="middle" font-weight="400">router</text>
<rect class="s0" x="670" y="82" width="120" height="16" rx="3"/>
<rect class="s2" x="670" y="102" width="120" height="16" rx="3"/>
<line class="ar" x1="614" y1="116" x2="666" y2="110" stroke-width="1.5" marker-end="url(#a)"/>
<text x="730" y="114" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">active expert</text>
<rect class="s0" x="670" y="122" width="120" height="16" rx="3"/>
<rect class="s0" x="670" y="142" width="120" height="16" rx="3"/>
<rect class="s0" x="670" y="162" width="120" height="16" rx="3"/>
<rect class="s2" x="670" y="182" width="120" height="16" rx="3"/>
<line class="ar" x1="614" y1="116" x2="666" y2="190" stroke-width="1.5" marker-end="url(#a)"/>
<text x="730" y="194" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">active expert</text>
<rect class="s0" x="670" y="202" width="120" height="16" rx="3"/>
<rect class="s0" x="670" y="222" width="120" height="16" rx="3"/>
<text class="mu" x="800" y="120" font-size="11" text-anchor="start" font-weight="400">... more</text>
<text class="t2" x="470" y="265" font-size="13" text-anchor="start" font-weight="400">read per token: ~3B</text>
<text class="t2" x="470" y="285" font-size="13" text-anchor="start" font-weight="400">in VRAM: all 35B</text>
<text class="t1" x="40" y="215" font-size="14" text-anchor="start" font-weight="600">Faster decode, same memory:</text>
<text class="t2" x="40" y="237" font-size="13" text-anchor="start" font-weight="400">MoE reads fewer weights per token,</text>
<text class="t2" x="40" y="257" font-size="13" text-anchor="start" font-weight="400">but every expert must stay in VRAM,</text>
<text class="t2" x="40" y="277" font-size="13" text-anchor="start" font-weight="400">since the next token may need any of them.</text>
</svg>
